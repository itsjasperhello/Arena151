name: Build Arena 151 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship with the Android SDK already installed (ANDROID_HOME).
      # Accept its licenses quietly; Gradle downloads any missing platform/build-tools itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Always rebuild the game file from the source in web/, so the APK can never ship a stale copy.
      - name: Rebuild game from source
        run: |
          python3 web/build.py
          grep -o "APP_VERSION = '[^']*'" app/src/main/assets/index.html

      # Stop here with a clear message if the bundled game has a JavaScript error
      # (an APK built from a broken game file installs fine but opens to a blank screen).
      - name: Check game script
        run: |
          # The page is made of several <script> parts; syntax-check each one.
          python3 - <<'PY'
          import re, subprocess, sys, pathlib
          h = pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          parts = re.findall(r'<script>\n(.*?)</script>', h, re.S)
          bad = 0
          for i, code in enumerate(parts):
              p = pathlib.Path(f'part{i}.js'); p.write_text(code, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(p)], capture_output=True, text=True)
              if r.returncode: bad += 1; print(r.stderr)
          print(len(parts), 'script parts checked,', bad, 'with errors'); sys.exit(1 if bad or not parts else 0)
          PY
          echo "Game script OK"

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Arena151-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
