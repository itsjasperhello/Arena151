# Arena 151 web server (port 8253): the game page + its sprites, music and cries, and the online game server at /ws.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;          # the Android app's assets folder (index.html, sprites/, music/, cry/)
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # Always fetch the newest game page.
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Folder listings as JSON: this is how the page finds your sprites, trainers, music and cries (like the Android app).
    location ~ ^/(sprites|music|cry)/$ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    # The online game server, on the same port as the page.
    location /ws {
        proxy_pass http://arena151:8151;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health { proxy_pass http://arena151:8151/health; }

    location ~ /\. { deny all; }
}
