services:
  arena151:
    build: .
    container_name: arena151-server
    ports:
      - "8151:8151"
    restart: unless-stopped
    environment:
      - PORT=8151
      # Set this if you run the server behind Cloudflare Tunnel or another proxy (so limits apply per player).
      # - TRUST_PROXY=1
      # Battle worker threads. Leave unset to use one per CPU core (up to 8).
      # - WORKERS=8
